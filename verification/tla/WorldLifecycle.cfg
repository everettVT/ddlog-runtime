\* Main configuration: two worlds (one instance, one test world with keep_world=false), two starts each, one owner, one persist failure, SIGKILL allowed. Every safety property HOLDS.
CONSTANTS
    Worlds = {w1, w2}
    TestWorlds = {w2}
    KeepWorld = FALSE
    MaxGen = 2
    MaxOwners = 1
    MaxPersistFails = 1
    AllowPanic = FALSE
    AllowKill = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    I1
    I2
    I3
    I4
    I5
    I6
    StaleThreadNeverInstalls
    NoTwoLiveNativeChildrenPerWorldWithinOwner
    NoTwoLiveProcessesPerWorldWithinOwner
    DiskHistoryConsistency
    LiveInstanceIsTracked
