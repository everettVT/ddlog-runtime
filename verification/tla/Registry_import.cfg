\* Safe configuration (import): ONE import_registry process racing a writer
\* that publishes/archives/restores the imported processor, a reader of it,
\* crashes, safe operator.  All properties are expected to HOLD.
CONSTANTS
    Writers = {w1}
    Importers = {i1}
    Readers = {r1}
    Vals = {v1, v2}
    InitVal = v1
    InitId = a
    ImportId = b
    CreateIds = {}
    OpIds = {b}
    ReadIds = {b}
    SrcV1 = v1
    SrcV2 = v2
    SrcCur = v2
    MaxRev = 2
    MaxCrashes = 1
    UnsafeOperator = FALSE
    None = None
SPECIFICATION Spec
VIEW View
SYMMETRY WriterSymmetry
INVARIANTS
    NoLostUpdate
    CurAlwaysPointsToExistingVersion
    ArchivedEventMatchesCur
    SnapshotLinearizable
    GetLinearizable
PROPERTIES
    VersionsImmutable
    OrphanBlocksTransitions
CHECK_DEADLOCK FALSE
