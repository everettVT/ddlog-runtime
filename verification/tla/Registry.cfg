\* Safe configuration (core): two writers doing publish/archive/restore/
\* create with crashes, a safe operator, and an unlocked reader.
\* All properties are expected to HOLD.  Single-importer safety is checked
\* separately in Registry_import.cfg (the combined run exceeded 8M states).
CONSTANTS
    Writers = {w1, w2}
    Importers = {}
    Readers = {r1}
    Vals = {v1, v2}
    InitVal = v1
    InitId = a
    ImportId = b
    CreateIds = {c}
    OpIds = {a}
    ReadIds = {a}
    SrcV1 = v1
    SrcV2 = v2
    SrcCur = v2
    MaxRev = 2
    MaxCrashes = 1
    UnsafeOperator = FALSE
    None = None
SPECIFICATION Spec
VIEW View
SYMMETRY WriterSymmetry
INVARIANTS
    NoLostUpdate
    CurAlwaysPointsToExistingVersion
    ArchivedEventMatchesCur
    SnapshotLinearizable
    GetLinearizable
PROPERTIES
    VersionsImmutable
    OrphanBlocksTransitions
CHECK_DEADLOCK FALSE
