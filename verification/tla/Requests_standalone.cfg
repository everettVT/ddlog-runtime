\* Standalone mode (host.rs:138): every property except C5 holds.
CONSTANTS
    Entities = {e1}
    Revs = {0, 1}
    Payloads = {x, y}
    Outs = {o1, o2}
    Workers = {k1, k2}
    AllowRogue = TRUE
    Mode = "standalone"
    MaxFailures = 1
    None = None
SPECIFICATION Spec
VIEW View
INVARIANTS
    AtMostOneOutputPerRequest
    NoCompletionWithoutClaim
    FreshFlagMatchesAgentResult
    ResultOnlyCurrent
    InMemoryNeverAheadOfNative
    MemMatchesNativeBetweenOps
    UncertainNeverReclaimed
    UncertainStaysClaimed
PROPERTIES
    ClaimOnlyFresh
CHECK_DEADLOCK FALSE
