\* Host mode (instance_id set).  All properties are expected to HOLD.
CONSTANTS
    Entities = {e1}
    Revs = {0, 1}
    Payloads = {x, y}
    Outs = {o1, o2}
    Workers = {k1, k2}
    AllowRogue = TRUE
    Mode = "host"
    MaxFailures = 1
    None = None
SPECIFICATION Spec
VIEW View
INVARIANTS
    AtMostOneOutputPerRequest
    NoCompletionWithoutClaim
    FreshFlagMatchesAgentResult
    ResultOnlyCurrent
    InMemoryNeverAheadOfNative
    MemMatchesNativeBetweenOps
    UncertainNeverReclaimed
    UncertainStaysClaimed
    NoAckWhileRuntimeDead
PROPERTIES
    ClaimOnlyFresh
CHECK_DEADLOCK FALSE
