name: Native installation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'src/checkpoint.rs'
      - 'src/world*.rs'
      - 'src/instance.rs'
      - 'src/instance_*.rs'
      - 'src/backend*.rs'
      - 'src/composition*.rs'
      - 'src/lowering*.rs'
      - 'src/lower.rs'
      - 'src/rows.rs'
      - 'src/lib.rs'
      - 'crates/syntax/**'
      - 'tests/worlds*.rs'
      - 'tests/worlds/**'
      - 'tests/fixtures/**'
      - 'src/iceberg_checkpoint.rs'
      - 'examples/iceberg_recovery.rs'
      - 'examples/support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/bootstrap-native.py'
      - 'scripts/build-ddlog.sh'
      - 'scripts/test-native-install.py'
      - '.github/workflows/native-install.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Iceberg toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Build host
        run: cargo build --locked --features mcp --bin lemmalog-ddlog-mcp
      - name: Install from pinned public inputs
        run: python3 scripts/bootstrap-native.py "$RUNNER_TEMP/ddlog-native"
      - name: Compile and exercise MCP
        run: |
          source "$RUNNER_TEMP/ddlog-native/env.sh"
          python3 scripts/test-native-install.py "$RUNNER_TEMP/native-smoke"
      - name: Native external cut and historical fork contracts
        run: |
          driver="$RUNNER_TEMP/native-contract-driver.sh"
          cat > "$driver" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          source "$RUNNER_TEMP/ddlog-native/env.sh"
          exec "$GITHUB_WORKSPACE/scripts/build-ddlog.sh" "$@"
          SH
          chmod +x "$driver"
          export DDLOG_RUNTIME_NATIVE_BUILD="$driver"
          cargo test --locked --test worlds_native external_cut_freezes_real_fixed_point_restores_and_retracts -- --ignored --nocapture
          cargo test --locked --test worlds_native historical_fork_restores_selected_fixed_point_and_retracts_independently -- --ignored --nocapture
      - name: Build runtime Iceberg acceptance
        run: cargo build --locked --features iceberg --example iceberg_recovery
      - name: Native Iceberg checkpoint across processes
        run: |
          source "$RUNNER_TEMP/ddlog-native/env.sh"
          root="$RUNNER_TEMP/iceberg-native"
          driver="$GITHUB_WORKSPACE/scripts/build-ddlog.sh"
          for phase in stage publish restore; do
            target/debug/examples/iceberg_recovery "$phase" "$root" "$driver" "file://$root/warehouse"
          done
      - name: Compile and exercise bundled operator
        run: |
          source "$RUNNER_TEMP/ddlog-native/env.sh"
          export LEMMALOG_DDLOG_MCP="$GITHUB_WORKSPACE/target/debug/lemmalog-ddlog-mcp"
          export SHARED_TEST_TIMEOUT=600
          export STAR_ARTIFACTS="$RUNNER_TEMP/native-star"
          python3 scripts/test-large-small-star.py
      - name: Report evidence and build errors
        if: always()
        run: |
          find "$RUNNER_TEMP/native-smoke" "$RUNNER_TEMP/native-star" -type f \( -name receipt.json -o -name build.log -o -name stderr.log \) -exec sh -c 'echo "$1"; tail -80 "$1"' sh {} \; 2>/dev/null || true
